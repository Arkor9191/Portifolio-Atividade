    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b31"/><stop offset="1" stop-color="#090d18"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="930" cy="90" r="250" fill="#625ce5" opacity=".09"/>
