  <path d="M105 140h990" stroke="#52617a" stroke-opacity=".45"/>
  <circle cx="140" cy="111" r="7" fill="#f87171"/><circle cx="166" cy="111" r="7" fill="#fbbf24"/><circle cx="192" cy="111" r="7" fill="#86efac"/>
  <text x="600" y="118" fill="#9aa8bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">estudos.js — fundamentos e lógica</text>
  <g font-family="monospace" font-size="25">
    <g fill="#64748b" text-anchor="end"><text x="170" y="208">01</text><text x="170" y="258">02</text><text x="170" y="308">03</text><text x="170" y="358">04</text><text x="170" y="408">05</text><text x="170" y="458">06</text><text x="170" y="508">07</text></g>
    <text x="205" y="208" fill="#c4b5fd">const <tspan fill="#93c5fd">resolverProblema</tspan> = (dados) =&gt; {</text>
    <text x="245" y="258" fill="#94a3b8">// Dividir em etapas menores</text>
    <text x="245" y="308" fill="#c4b5fd">const <tspan fill="#f9a8d4">resultado</tspan> = dados.map((item) =&gt; {</text>
    <text x="285" y="358" fill="#86efac">return <tspan fill="#fcd34d">validar</tspan>(item);</text>
    <text x="245" y="408" fill="#c4b5fd">});</text>
    <text x="245" y="458" fill="#c4b5fd">return <tspan fill="#93c5fd">resultado</tspan>;</text>
    <text x="205" y="508" fill="#c4b5fd">};</text>
  </g>
  <rect x="205" y="535" width="245" height="34" rx="17" fill="#8177f5" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".42"/>
  <text x="327" y="558" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">LÓGICA • JAVASCRIPT • PRÁTICA</text>
